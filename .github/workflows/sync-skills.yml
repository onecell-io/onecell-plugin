# Keep the bundled skills identical to the live ones on onecell.io.
#
# onecell's skills change with the product. The plugin ships copies so it works the moment
# it is installed; this pulls the live files once a day (or on demand) and commits any
# change. The plugin has no `version`, so installs track commits and pick it up.
name: Sync skills

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the live skills
        run: |
          set -euo pipefail
          for skill in onecell onecell-bridge onecell-delivery onecell-map onecell-cards-collection onecell-handoff; do
            mkdir -p "plugins/onecell/skills/${skill}"
            curl -fsS "https://onecell.io/skills/${skill}.md" -o "plugins/onecell/skills/${skill}/SKILL.md.new"
            # A skill always opens with its frontmatter; anything else (an error page,
            # the deploy fallback) must never replace a good copy.
            head -1 "plugins/onecell/skills/${skill}/SKILL.md.new" | grep -qx -- '---'
            grep -q "^name: ${skill}$" "plugins/onecell/skills/${skill}/SKILL.md.new"
            mv "plugins/onecell/skills/${skill}/SKILL.md.new" "plugins/onecell/skills/${skill}/SKILL.md"
          done
      - name: Pull the files the skills come with
        run: |
          set -euo pipefail
          # The closed list in onecell's lib/skills.ts (SKILL_FILES); a file missing or empty
          # on the live site never replaces the bundled copy.
          for f in onecell-map/scripts/to_geojson.py onecell-map/assets/map-template.html onecell-cards-collection/scripts/build_items.py; do
            mkdir -p "plugins/onecell/skills/$(dirname "$f")"
            curl -fsS "https://onecell.io/skills/${f}" -o "plugins/onecell/skills/${f}.new"
            test -s "plugins/onecell/skills/${f}.new"
            mv "plugins/onecell/skills/${f}.new" "plugins/onecell/skills/${f}"
          done
      - name: Pull the live hook script
        run: |
          set -euo pipefail
          out=plugins/onecell-hooks/scripts/onecell-hook.sh
          curl -fsS "https://onecell.io/agent-setup/hook.sh" -o "$out.new"
          # Same guard as the skills: only a real script with this deployment's origin
          # filled in may replace the bundled copy.
          head -1 "$out.new" | grep -qx '#!/bin/sh'
          grep -q "^ONECELL_DEFAULT_URL='https://onecell.io'$" "$out.new"
          sh -n "$out.new"
          mv "$out.new" "$out" && chmod +x "$out"
      - name: Commit if they changed
        run: |
          if git diff --quiet; then echo "skills and hook unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync skills and hook script from onecell.io"
          git push
